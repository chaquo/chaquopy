[tool.towncrier]
directory = "product/runtime/docs/sphinx/changes"
filename = "product/runtime/docs/sphinx/changelog.rst"
issue_format = "`#{issue} <https://github.com/chaquo/chaquopy/issues/{issue}>`__"
wrap = true

# In order of importance, corresponding to the 3 components of the version number.
type = [
    { directory = "removal", name = "Incompatible changes"},
    { directory = "feature", name = "Features"},
    { directory = "bugfix", name = "Bugfixes"},
]
